<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Free Fire BD Top Up</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-4">
<div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow">
<h1 class="text-2xl font-black text-[#e91e63]">Admin Panel - FF BD Top Up</h1>
<p class="text-sm">Owner: 01837450067 - bKash/Nagad/Rocket - MasterCard/Visa/Dollar</p>
<p class="mt-2 text-xs bg-yellow-100 p-2 rounded">System: আগে টাকা আসবে (01837450067) -> Pending থাকবে -> তুমি Confirm করলে Done হবে</p>
<div class="mt-4 grid grid-cols-3 gap-3 text-center">
<div class="bg-blue-100 p-3 rounded-xl"><p class="text-2xl font-bold" id="pendingCount">0</p><p class="text-xs">Pending</p></div>
<div class="bg-green-100 p-3 rounded-xl"><p class="text-2xl font-bold" id="doneCount">0</p><p class="text-xs">Done</p></div>
<div class="bg-purple-100 p-3 rounded-xl"><p class="text-2xl font-bold">01837450067</p><p class="text-xs">bKash</p></div>
</div>
<div class="mt-6"><h2 class="font-bold">All Orders</h2><div id="list" class="mt-3 space-y-2"></div></div>
<button onclick="clearAll()" class="mt-6 bg-red-500 text-white px-4 py-2 rounded">Clear All</button>
<a href="index.html" class="ml-3 bg-[#e91e63] text-white px-4 py-2 rounded">Go to Website</a>
</div>
<script>
function load(){
let o=JSON.parse(localStorage.getItem('ff')||'[]');
document.getElementById('pendingCount').innerText=o.filter(x=>x.status=='Pending').length;
document.getElementById('doneCount').innerText=o.filter(x=>x.status=='Done').length;
let h='';
o.forEach((x,i)=>{
h+=`<div class="border rounded-xl p-3 flex justify-between items-center"><div><p class="font-bold">UID: ${x.uid} - ${x.pack}</p><p class="text-xs">Pay: ${x.pay} | Trx: ${x.trx}</p><span class="${x.status=='Done'?'bg-green-100 text-green-600':'bg-blue-100 text-blue-600'} px-2 py-1 rounded text-xs">${x.status}</span></div><div class="flex gap-2">${x.status=='Pending'?`<button onclick="confirmI(${i})" class="bg-green-500 text-white px-3 py-1 rounded text-xs">Confirm</button>`:''}<button onclick="del(${i})" class="bg-red-400 text-white px-2 py-1 rounded text-xs">X</button></div></div>`;
});
document.getElementById('list').innerHTML=h||'No Orders Yet';
}
function confirmI(i){let o=JSON.parse(localStorage.getItem('ff')||'[]');o[i].status='Done';localStorage.setItem('ff',JSON.stringify(o));load();alert('Confirmed!');}
function del(i){let o=JSON.parse(localStorage.getItem('ff')||'[]');o.splice(i,1);localStorage.setItem('ff',JSON.stringify(o));load();}
function clearAll(){if(confirm('Clear?')){localStorage.removeItem('ff');load();}}
load();setInterval(load,3000);
</script>
</body></html>
